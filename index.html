<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>For You ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
    background:url('bg1.jpg');
    background-size:cover;
    background-position:center;
}

.container{
    background:rgba(0,0,0,0.7);
    min-height:100vh;
    padding:20px;
}

#content{
    display:none;
}

input{
    padding:10px;
    width:250px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}

img{
    width:300px;
    max-width:90%;
    border-radius:20px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div id="login">

<h1>💌 A Little Surprise</h1>

<p>Enter Password</p>

<input type="password" id="password">

<br><br>

<button onclick="checkPassword()">
Open ❤️
</button>

</div>

<div id="content">

<h1>Never Lose Your Inner Child ❤️</h1>

<p>
No matter how old you grow,
please never lose the little child inside you.
</p>

<h2>Then ✨</h2>

<img src="child.jpg">

<h2>Now ❤️</h2>

<img src="adult.jpg">

</div>

</div>

<script>

function checkPassword(){

var pass =
document.getElementById("password").value;

if(pass === "zwanzig"){

document.getElementById("login").style.display = "none";

document.getElementById("content").style.display = "block";

}else{

alert("Wrong password");

}

}

</script>

</body>
</html>
